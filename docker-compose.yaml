version: '3.8'

services:
  bot:
    build: .
    image: telegram-bot:latest # замени на имя твоего образа
    container_name: telegram-bot
    restart: unless-stopped
    expose:
      - '3000' # порт, который слушает твой бот
    networks:
      - web

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
